name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore shared debug key
        run: base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "nearwave-${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearwave-${{ github.run_number }}
          path: nearwave-*.apk

      # Phone-friendly download: Releases > "Latest build" always holds the newest APK.
      - name: Update "Latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build nearwave-*.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}. Open this page on your phone and tap the .apk to install."
